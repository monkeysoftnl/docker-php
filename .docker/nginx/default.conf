log_format main_xff '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" "$http_x_forwarded_for"';

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Trust X-Forwarded-For from the reverse proxy (NPM) on private/Docker networks
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 100M;

    access_log /dev/stdout main_xff;
    error_log /dev/stderr;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Replacement for Apache XSendFile: app sends X-Accel-Redirect (or X-Sendfile
    # with Symfony/Laravel trustXSendfileTypeHeader() + X-Accel-Mapping below).
    location /private-files/ {
        internal;
        alias /var/www/html/storage/app/private/;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTP_X_ACCEL_MAPPING "/var/www/html/storage/app/private/=/private-files/";
        fastcgi_read_timeout 90s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
